<VirtualHost *:80>
    ServerName pickylens.neovantia.live
    Redirect permanent / https://pickylens.neovantia.live/
</VirtualHost>
<VirtualHost *:443>
    ServerName pickylens.neovantia.live
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/neovantia.live/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/neovantia.live/privkey.pem
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8062/ retry=0 timeout=180
    ProxyPassReverse / http://127.0.0.1:8062/
    RequestHeader set X-Forwarded-Proto "https"
    LimitRequestBody 262144
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Robots-Tag "noindex, nofollow"
    ErrorLog ${APACHE_LOG_DIR}/pickylens-error.log
    CustomLog ${APACHE_LOG_DIR}/pickylens-access.log combined
</VirtualHost>
